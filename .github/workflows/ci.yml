name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Instalar dependencias de test
        run: pip install -r requirements-test.txt
      - name: Ejecutar tests
        run: python -m pytest -q

  frontend:
    name: Frontend (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Ejecutar tests
        run: npm test -- --watchAll=false
        env:
          CI: "true"
      - name: Build de producción
        run: npm run build
        env:
          CI: "true"

  docker-build:
    name: Imagen ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: autenticacion, context: backend/autenticacion, dockerfile: backend/autenticacion/Dockerfile }
          - { name: casos, context: backend/casos, dockerfile: backend/casos/Dockerfile }
          - { name: documentos, context: backend/documentos, dockerfile: backend/documentos/Dockerfile }
          - { name: notificaciones, context: backend/notificaciones, dockerfile: backend/notificaciones/Dockerfile }
          - { name: reportes, context: backend/reportes, dockerfile: backend/reportes/Dockerfile }
          - { name: ia-seguridad, context: backend, dockerfile: backend/ia-seguridad/Dockerfile }
          - { name: frontend, context: frontend, dockerfile: frontend/Dockerfile }
    steps:
      - uses: actions/checkout@v7
      - name: docker build (sin push)
        run: docker build -f ${{ matrix.dockerfile }} -t causas/${{ matrix.name }}:ci ${{ matrix.context }}
